name: CP13 Backend Audit
on:
  pull_request:
    paths:
      - 'audit/**'
      - '.github/workflows/backend-audit-cp13.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gameops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gameops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_ephemeral_only@127.0.0.1:5432/gameops_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run existing regression suite
        run: npm test | tee baseline-test.log
      - name: Audit unchanged backend through actual server
        run: node audit/cp13-backend-audit.cjs
      - name: Classify complete route declarations
        run: node audit/cp13-route-inventory.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp13-backend-audit-evidence
          path: |
            audit-results/
            baseline-test.log
            audit/cp13-backend-audit.cjs
            audit/cp13-route-inventory.cjs
          retention-days: 14
