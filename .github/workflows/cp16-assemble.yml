name: CP16 Admin Source Assembly
on:
  push:
    branches: [feat/cp16-authoritative-wallet-20261103]
    paths: ['.github/workflows/cp16-assemble.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cp16-authoritative-wallet-20261103
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact runtime delta
        run: |
          python - <<'PY'
          import base64,zlib,hashlib,pathlib,subprocess
          base='5f9711dc4a531c5be3365e3920d0e5056796d565'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          pieces=[]
          for i in range(1,19):
            text=pathlib.Path(f'.cp16-transfer/{i:02d}.b64').read_text().strip()
            if i==4:text=text.replace('Xb5xXb51xX75xX9Rr','Xb5xXb51X75xX9Rr')
            pieces.append(text)
          patch=zlib.decompress(base64.b64decode(''.join(pieces),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='43ce9163977f8c2275a7a5f0db0dd28fcf1659087edff2928d3fddba4deafab9'
          allowed={'.github/workflows/cp16-wallet.yml','engine/security-policy.js','engine/source-wallet-protocol.js','engine/source-wallet.js','package-lock.json','package.json','public/data-ui.js','public/data.css','public/data.html','server.js','sources/PLAYGROUND_CHECKPOINT_16_SOURCE_WALLET.md','tests/cp16-wallet-live.cjs','tests/source-wallet.test.js'}
          changed={line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          assert changed==allowed,(changed,allowed)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','-'],input=patch,check=True)
          for p in pathlib.Path('.cp16-transfer').glob('*.b64'):p.unlink()
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --test tests/source-wallet.test.js
      - name: Publish runtime without modifying workflows
        run: |
          git config user.name '9dbit'
          git config user.email '154832153+9dbit@users.noreply.github.com'
          git add engine public server.js package.json package-lock.json sources tests .cp16-transfer
          git commit -m 'feat(cp16): authoritative source balances, staged requests and verified application receipts'
          git push origin HEAD:feat/cp16-authoritative-wallet-20261103
          git rev-parse HEAD
