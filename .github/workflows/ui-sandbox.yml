name: Isolated UI Sandbox
on:
  pull_request:
    paths: ['sandbox/**', '.github/workflows/ui-sandbox.yml']
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test --prefix sandbox
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Test browser-only simulator and no production network
        run: |
          PORT=8777 node sandbox/server.cjs > /tmp/sandbox.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8777/health && break; sleep 1; done
          python sandbox/tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-sandbox-qa
          path: test-results/
          retention-days: 7
