name: CP14 P1 P2 Remediation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  full-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gameops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gameops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_ephemeral_only@127.0.0.1:5432/gameops_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression and full-server acceptance tests
        run: |
          set -euo pipefail
          npm test 2>&1 | tee cp14-regression.log
          node tests/assert-cp14-evidence.cjs
      - name: Install browser tooling without changing lockfile
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser acceptance against actual server and PostgreSQL
        run: |
          set -euo pipefail
          node tests/p1p2-live-browser.cjs 2>&1 | tee cp14-browser.log
      - name: Package reviewed source
        if: always()
        run: |
          git archive --format=tar.gz --output=cp14-source.tar.gz HEAD
          git rev-parse HEAD > cp14-tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp14-release-evidence
          path: |
            cp14-source.tar.gz
            cp14-tested-commit.txt
            cp14-regression.log
            cp14-browser.log
            test-results/
          retention-days: 14
