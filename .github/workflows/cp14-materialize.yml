name: CP14 One-Time Source Materialization
on:
  push:
    branches: [fix/cp14-backend-p1-p2-20261103]
    paths:
      - maintenance/cp14-edit-plan.json
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: github.repository == '9dbit/Playground' && github.ref == 'refs/heads/fix/cp14-backend-p1-p2-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cp14-backend-p1-p2-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every input and output before writing reviewed source
        run: python3 maintenance/cp14-apply.py
      - name: Generate reproducible dependency lock and check syntax
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit to this feature branch only, without force
        run: |
          git config user.name 'Playground Remediation'
          git config user.email 'qa@users.noreply.github.com'
          git add -- engine/admin-operations.js engine/deep-routes.js engine/security.js package.json package-lock.json public/control.js public/engine.js public/parity.css server.js tests/admin-operations.test.js
          git diff --cached --stat
          git commit -m 'fix(cp14): materialize hash-verified P1/P2 implementation and lockfile'
          git push origin HEAD:refs/heads/fix/cp14-backend-p1-p2-20261103
# This feature-branch-only transport is removed before merge. It has no database,
# production environment, secret reads, force-push or main-branch write action.
