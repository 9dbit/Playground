name: CP15 Source Receiver Data Acceptance
on:
  push:
    branches: [feat/cp15-game-data-20261103, main]
  pull_request:
    paths: ['engine/**','server.js','public/data*','tests/cp15*','.github/workflows/cp15-data.yml']
permissions:
  contents: read
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gameops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gameops_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_ephemeral_only@127.0.0.1:5432/gameops_ci
      UNO_CP15_ROOT: ${{ github.workspace }}/uno-source
      GAMEOPS_ADDITIONAL_KEYS: '[]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 9dbit/uno-luck
          ref: 5c060f8562aa98554f9fb064710042f07c658b40
          path: uno-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --no-audit --no-fund
      - run: pip install -r uno-source/requirements.txt pytest==9.0.2 httpx==0.28.1 Pillow
      - run: npm test | tee cp15-regression.log
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Original CP14 real server regression
        run: CP14_BROWSER=true node tests/cp14-server.cjs
      - name: Actual source outbox and receiver, failure/restart recovery and browser
        run: node tests/cp15-live.cjs
      - name: Archive exact source without secrets
        if: always()
        run: |
          mkdir -p cp15-evidence
          git archive --format=tar HEAD > cp15-evidence/admin-source.tar
          git -C uno-source archive --format=tar HEAD app tests/test_gameops_outbox.py deploy/start-web.sh sources/CP15_ROUND_OUTBOX.md > cp15-evidence/uno-source.tar
          cp cp15-regression.log cp15-evidence/ || true
          cp -R test-results cp15-evidence/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp15-data-evidence
          path: cp15-evidence/
          retention-days: 14
