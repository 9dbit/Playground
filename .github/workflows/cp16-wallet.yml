name: CP16 Authoritative Source Wallet Acceptance
on:
  push:
    branches: [feat/cp16-wallet-admin-20261103]
  pull_request:
    paths:
      - 'engine/source-wallet.js'
      - 'engine/security-policy.js'
      - 'server.js'
      - 'public/wallet*'
      - 'tests/source-wallet.test.js'
      - 'tests/cp16*'
      - '.github/workflows/cp16-wallet.yml'
permissions:
  contents: read
jobs:
  wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gameops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gameops_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_ephemeral_only@127.0.0.1:5432/gameops_ci
      UNO_CP15_ROOT: ./uno-source
      GAMEOPS_WALLET_KEYS: '[]'
      GAMEOPS_ADMIN_WALLET_COMMANDS_ENABLED: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 9dbit/uno-luck
          ref: da102743ac1d1a91819219eb8b8944dec86a0854
          path: uno-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --no-audit --no-fund
      - run: pip install -r uno-source/requirements.txt pytest==9.0.2 httpx==0.28.1 Pillow
      - name: Regression with correct pipe failure propagation
        shell: bash
        run: |
          set -o pipefail
          npm test | tee cp16-regression.log
      - name: Source wallet regression (UNO)
        run: python -m pytest -q uno-source/tests/test_wallet_link.py
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Full CP14 real server regression
        run: CP14_BROWSER=true node tests/cp14-server.cjs
      - name: Existing CP15 source round integration remains compatible
        run: node tests/cp15-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp16-wallet-baseline
          path: |
            cp16-regression.log
            test-results/
            sources/PLAYGROUND_CHECKPOINT_16_WALLET.md
          retention-days: 14
