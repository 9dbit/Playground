name: CP09 Source Audit
on:
  pull_request:
    paths: ['.github/workflows/bridge-source-audit.yml']
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: playground
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 9dbit/Skygate
          ref: main
          path: skygate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 9dbit/uno-luck
          ref: fix/uno-v13-solid-uno-led-emissive-20261019
          path: uno
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 9dbit/Mahjong-legend
          ref: main
          path: mahjong
          persist-credentials: false
      - name: Collect tracked source, excluding assets and credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tarfile, json
          manifest = {}
          with tarfile.open('cp09-source-audit.tar.gz', 'w:gz') as archive:
            for name in ['playground', 'skygate', 'uno', 'mahjong']:
              root = pathlib.Path(name)
              manifest[name] = subprocess.check_output(['git','-C',name,'rev-parse','HEAD'],text=True).strip()
              files = subprocess.check_output(['git','-C',name,'ls-files','-z']).decode().split('\0')
              for rel in files:
                if not rel:
                  continue
                p=root/rel
                if p.is_symlink() or not p.is_file() or p.stat().st_size > 3000000:
                  continue
                if p.name.startswith('.env') or any(part in ['.git','node_modules','.venv'] for part in p.parts):
                  continue
                if p.suffix.lower() in ['.js','.mjs','.cjs','.ts','.tsx','.jsx','.json','.py','.md','.html','.css','.yml','.yaml','.toml','.txt'] or p.name in ['Dockerfile','.gitignore']:
                  archive.add(p,arcname=str(p))
          pathlib.Path('source-revisions.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cp09-source-audit
          path: |
            cp09-source-audit.tar.gz
            source-revisions.json
          retention-days: 1
