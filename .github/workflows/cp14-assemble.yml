name: Assemble and verify CP14 repair
on:
  push:
    branches: [fix/cp14-p1-p2-backend]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == '9dbit/Playground' && github.ref == 'refs/heads/fix/cp14-p1-p2-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gameops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gameops_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_ephemeral_only@127.0.0.1:5432/gameops_ci
      CP14_BROWSER: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply guarded source repairs
        run: |
          python3 maintenance/cp14-source.py
          python3 maintenance/cp14-ui.py
          git diff --check
      - name: Resolve and lock dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests
        run: npm test | tee cp14-tests.log
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Real server and browser acceptance
        run: node tests/cp14-server.cjs | tee cp14-full-server.log
      - name: Existing browser regression
        run: |
          node tests/security-ui.cjs
          node tests/bridge-ui.cjs
          node tests/parity-ui.cjs
          node tests/admin-operations-ui.cjs
          node tests/game-detail-ui.cjs
      - name: Prepare verified source commit
        run: |
          rm maintenance/cp14-source.py maintenance/cp14-ui.py .github/workflows/cp14-assemble.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine public tests package.json package-lock.json server.js sources .github/workflows maintenance
          git diff --cached --check
          git commit -m 'fix(cp14): close audited P1/P2 defects with full-server acceptance and locked dependencies'
          mkdir -p cp14-build
          git bundle create cp14-build/verified.bundle HEAD
          git rev-parse HEAD > cp14-build/verified-commit.txt
          git archive --format=tar HEAD > cp14-build/source.tar
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p cp14-build
          cp cp14-tests.log cp14-full-server.log cp14-build/ 2>/dev/null || true
          if test -d test-results; then cp -R test-results cp14-build/; fi
          git diff > cp14-build/worktree-diff.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp14-verified-build
          path: cp14-build/
          retention-days: 14
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: cp14-verified-build
          path: cp14-build
      - name: Publish tested commit to the repair branch only
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          git fetch ./cp14-build/verified.bundle HEAD
          test "$(git rev-parse FETCH_HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse FETCH_HEAD)" = "$(cat cp14-build/verified-commit.txt)"
          git push origin FETCH_HEAD:refs/heads/fix/cp14-p1-p2-backend
