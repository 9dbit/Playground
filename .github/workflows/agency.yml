name: Agency system simulations
on:
  push:
    branches: [feat/agent-platform-20261103]
  pull_request:
    paths:
      - 'engine/agency/**'
      - 'engine/security*'
      - 'engine/runtime-credentials.js'
      - 'tests/security*'
      - 'public/login*'
      - 'public/agency*'
      - 'tests/agency*'
      - 'server.js'
      - 'package*.json'
      - '.github/workflows/agency.yml'
permissions:
  contents: read
jobs:
  agency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gameops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gameops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_ephemeral_only@127.0.0.1:5432/gameops_ci
      AGENCY_BROWSER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:agency
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-postgresql-browser-evidence
          path: test-results/
          retention-days: 14
