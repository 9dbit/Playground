<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playground · Sign in</title><link href="/assets/engine.css" rel="stylesheet"></head><body class="login-body"><main class="login-card"><div class="logo">◈ PLAYGROUND<span> CONTROL</span></div><h1>Welcome back.</h1><p>Secure admin access for your game operations.</p><form id="login"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in →</button><p id="error" role="alert"></p></form><small>Playground · GameOps Engine 0.4</small></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.ok)location.href='/engine';else document.getElementById('error').textContent=(await r.json()).error||'Login failed';});</script></body></html>
